name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-deck-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Svelte and TypeScript checks
        run: pnpm check

      - name: Run release compliance tests
        run: pnpm compliance:test

      - name: Test the remapped-build launcher
        run: node --test scripts/release-compliance/tests/test_run_tauri_remapped.mjs

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Run strict Rust lint
        run: cargo clippy --locked -- -D warnings
        working-directory: src-tauri
