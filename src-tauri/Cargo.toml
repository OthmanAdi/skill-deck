[package]
name = "skill-deck"
version = "0.3.0"
description = "Local-first coding agent skill browser and on-device agent harness"
authors = ["Ahmad Othman Ammar Adi"]
edition = "2021"
license = "MPL-2.0"
default-run = "skill-deck"

[[bin]]
name = "skill-deck"
path = "src/main.rs"

[lib]
name = "skill_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[example]]
name = "harness-cli"
path = "examples/harness_cli.rs"
required-features = ["developer-tools"]

[features]
default = []
# Headless diagnostics are operator-only Cargo examples.
# Keeping them out of Cargo's bin target set prevents Tauri from treating them
# as customer bundle executables.
developer-tools = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2", features = ["tray-icon"] }
# Must be registered before all other plugins so a secondary process exits
# during plugin setup.
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# --- System detection ---
sysinfo = "0.34"

# --- Async ---
tokio = { version = "1", features = ["full"] }

# --- Markdown/frontmatter parsing ---
gray_matter = "0.2"

# --- Error handling ---
thiserror = "2"
anyhow = "1.0.103"

# --- Logging ---
log = "0.4"
env_logger = "0.11"

# --- Path utilities ---
dirs = "6"
glob = "0.3"
walkdir = "2"

# --- Pattern matching ---
regex = "1"

# --- Hashing (snapshot + built-in model integrity) ---
sha2 = "0.10"

# --- HTTP client (for update checking via GitHub API + AI providers) ---
reqwest = { version = "0.12", features = ["json", "stream"] }

# --- Time + ids (shared by archive history + harness) ---
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# --- ReAct harness ---
# rig-core gives us provider abstraction (Ollama + Azure OpenAI native), Tool trait,
# PromptHook + ToolCallHookAction middleware, streaming, dynamic_context for skill RAG,
# and InMemoryVectorStore. Native TLS avoids shipping aws-lc-sys native build paths.
# No SSE / ndjson hand-rolling.
rig-core = { version = "0.35", default-features = false, features = [
  "reqwest",
  "native-tls",
] }
# tiktoken-rs covers OpenAI-family token counting (o200k_base + cl100k_base).
# Ollama models use the native /api/chat prompt_eval_count for ground truth.
tiktoken-rs = "0.9"
# schemars derives JSON schema for tool argument types (rig consumes Value, this saves
# us from hand-writing every parameters object).
schemars = "0.8"
# clap for the harness-cli binary subcommands (models, tokens, health, tools, chat, eval, …).
clap = { version = "4", features = ["derive"] }
# async-trait + futures-util are re-added because the harness needs them directly
# (rig also uses them transitively, but our own traits + stream collectors call them).
async-trait = "0.1"
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["all-extensions"] }
procfs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
